<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>matchpal 悬浮窗</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
  <style>
    :root {
      color-scheme: dark;
      --bg: #050505;
      --core: #0b0e11;
      --hairline: rgba(255, 255, 255, 0.08);
      --hairline-strong: rgba(255, 255, 255, 0.14);
      --shell: rgba(255, 255, 255, 0.04);
      --glass: rgba(22, 26, 30, 0.78);
      --glass-filter: blur(28px) saturate(120%);
      --text: #f2f6f3;
      --muted: #97a1ab;
      --faint: #5f6a72;
      --accent: #b7ead4;
      --accent-dim: rgba(183, 234, 212, 0.14);
      --accent-line: rgba(183, 234, 212, 0.35);
      --blue: #73bdf5;
      --bad: #f47788;
      --warn: #f1d973;
      --font-ui: "Space Grotesk", "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
      --font-mono: "JetBrains Mono", "Cascadia Mono", Consolas, monospace;
      --ease: cubic-bezier(0.32, 0.72, 0, 1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    html, body {
      height: 100%;
      background: transparent;
      overflow: hidden;
      font-family: var(--font-ui);
      color: var(--text);
      font-size: 12px;
    }
    body { display: none; }
    body.view-pill, body.view-dot, body.view-panel { display: block; }

    /* ---------- 胶囊 ---------- */
    #pill {
      display: none;
      align-items: center;
      gap: 11px;
      height: 100%;
      padding: 0 8px 0 16px;
      border-radius: 999px;
      background: var(--glass);
      -webkit-backdrop-filter: var(--glass-filter);
      backdrop-filter: var(--glass-filter);
      border: 1px solid var(--hairline);
      box-shadow: 0 14px 34px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.07);
      cursor: pointer;
      transition: border-color 0.5s var(--ease);
    }
    #pill:hover { border-color: var(--hairline-strong); }
    body.view-pill #pill { display: flex; }
    .dot {
      flex: 0 0 auto;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--faint);
      transition: background 0.5s var(--ease), box-shadow 0.5s var(--ease);
    }
    .dot.live { background: var(--accent); box-shadow: 0 0 9px rgba(183, 234, 212, 0.7); animation: breathe 2.2s var(--ease) infinite; }
    .dot.bad { background: var(--bad); box-shadow: 0 0 9px rgba(244, 119, 136, 0.55); }
    .dot.warn { background: var(--warn); }
    @keyframes breathe { 0%, 100% { opacity: 0.5; transform: scale(0.85); } 50% { opacity: 1; transform: scale(1); } }

    .info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px; }
    #state { font-family: var(--font-mono); font-size: 11.5px; letter-spacing: 0.06em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .roster { display: flex; gap: 3px; align-items: center; }
    .roster i {
      width: 9px; height: 3px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.09);
      transition: background 0.5s var(--ease);
    }
    .roster i.on { background: var(--accent); }
    .roster .count { font-family: var(--font-mono); font-size: 9.5px; color: var(--muted); margin-left: 5px; }

    .btns { flex: 0 0 auto; display: flex; gap: 3px; }
    .icon-btn {
      width: 26px; height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      border: none;
      background: transparent;
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: 12px;
      cursor: pointer;
      transition: background 0.5s var(--ease), color 0.5s var(--ease), transform 0.3s var(--ease);
    }
    .icon-btn:hover { background: rgba(255, 255, 255, 0.08); color: var(--text); }
    .icon-btn:active { transform: scale(0.92); }

    /* ---------- 圆钮 ---------- */
    #dot-view {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      height: 100%;
      border-radius: 50%;
      background: var(--glass);
      -webkit-backdrop-filter: var(--glass-filter);
      backdrop-filter: var(--glass-filter);
      border: 1px solid var(--hairline);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.07);
      cursor: pointer;
      transition: border-color 0.5s var(--ease), transform 0.5s var(--ease);
    }
    #dot-view:hover { border-color: var(--accent-line); transform: scale(1.05); }
    body.view-dot #dot-view { display: flex; }
    #dot-view .dot { width: 10px; height: 10px; }
    #dot-view .mini { font-family: var(--font-mono); font-size: 9px; color: var(--muted); }

    /* ---------- 数据面板：双层嵌壳 ---------- */
    #panel {
      display: none;
      flex-direction: column;
      height: 100%;
      border-radius: 1.6rem;
      background: var(--shell);
      border: 1px solid var(--hairline);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      padding: 6px;
    }
    body.view-panel #panel { display: flex; }
    #panel-inner {
      flex: 1;
      display: flex;
      flex-direction: column;
      border-radius: calc(1.6rem - 0.4rem);
      background: var(--core);
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.06);
      overflow: hidden;
    }
    #panel-head {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 11px 14px;
      border-bottom: 1px solid var(--hairline);
      cursor: grab;
    }
    #panel-head .tag {
      font-family: var(--font-mono);
      font-size: 8.5px;
      font-weight: 600;
      letter-spacing: 0.2em;
      color: var(--accent);
      background: var(--accent-dim);
      border: 1px solid var(--accent-line);
      border-radius: 999px;
      padding: 3px 10px;
    }
    #panel-head .map { font-family: var(--font-mono); font-size: 10.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #panel-head .spacer { flex: 1; }
    #panel-body { flex: 1; overflow-y: auto; padding: 8px 12px 10px; }
    .team-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-mono);
      font-size: 8.5px;
      letter-spacing: 0.22em;
      color: var(--faint);
      padding: 8px 2px 5px;
    }
    .team-title::after { content: ""; flex: 1; height: 1px; background: var(--hairline); }
    .team-title.ct { color: var(--accent); }
    .team-title.t { color: var(--blue); }
    .prow {
      display: flex;
      align-items: baseline;
      gap: 9px;
      padding: 4.5px 8px;
      border-radius: 9px;
      cursor: pointer;
      transition: background 0.4s var(--ease);
    }
    .prow:hover { background: rgba(255, 255, 255, 0.05); }
    .prow .nick {
      flex: 1;
      min-width: 0;
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .prow .rating { font-family: var(--font-mono); font-size: 12px; font-weight: 600; width: 42px; text-align: right; font-variant-numeric: tabular-nums; }
    .prow .kd, .prow .score { font-family: var(--font-mono); font-size: 10px; color: var(--muted); width: 46px; text-align: right; }
    .rating.great { color: var(--accent); text-shadow: 0 0 16px rgba(183, 234, 212, 0.4); }
    .rating.poor { color: var(--bad); }
    .rating.low { color: var(--warn); }
    #panel-foot {
      padding: 8px 14px;
      border-top: 1px solid var(--hairline);
      font-size: 9.5px;
      color: var(--faint);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    #panel-foot .btns { gap: 2px; }
    #panel-foot .icon-btn { width: 22px; height: 22px; font-size: 11px; }
  </style>
</head>
<body class="view-pill">
  <div id="pill" data-tauri-drag-region>
    <span class="dot" id="pill-dot" data-tauri-drag-region></span>
    <div class="info" data-tauri-drag-region>
      <span id="state">STANDBY</span>
      <div class="roster" id="roster" data-tauri-drag-region></div>
    </div>
    <div class="btns">
      <button class="icon-btn" id="collapse" title="收成小圆钮">–</button>
      <button class="icon-btn" id="hide" title="关闭悬浮窗">×</button>
    </div>
  </div>

  <div id="dot-view" data-tauri-drag-region title="点击展开">
    <span class="dot" id="dot-dot"></span>
    <span class="mini" id="mini-count"></span>
  </div>

  <div id="panel">
    <div id="panel-inner">
      <div id="panel-head" data-tauri-drag-region>
        <span class="tag">REPORTED</span>
        <span class="map" id="panel-map">-</span>
        <span class="spacer"></span>
      </div>
      <div id="panel-body"></div>
      <div id="panel-foot">
        <span>点击玩家行回主窗口</span>
        <div class="btns">
          <button class="icon-btn" id="panel-shrink" title="收回胶囊">–</button>
          <button class="icon-btn" id="hide2" title="关闭悬浮窗">×</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const { invoke } = window.__TAURI__.core;
    const { listen } = window.__TAURI__.event;

    const el = (id) => document.getElementById(id);
    let full = 0;
    let loaded = 0;
    let lastReport = null;

    function setDot(mode) {
      for (const id of ["pill-dot", "dot-dot"]) el(id).className = `dot ${mode}`;
    }

    function setState(text, mode) {
      el("state").textContent = text;
      el("mini-count").textContent = mode === "live" && full ? `${loaded}/${full}` : text === "已出表" ? "✓" : "";
      setDot(mode || "");
    }

    function renderRoster() {
      const box = el("roster");
      box.innerHTML = "";
      if (!full || full > 16) return;
      for (let i = 0; i < full; i++) {
        const seg = document.createElement("i");
        if (i < loaded) seg.className = "on";
        box.appendChild(seg);
      }
      const count = document.createElement("span");
      count.className = "count";
      count.textContent = `${loaded}/${full}`;
      box.appendChild(count);
    }

    function ratingClass(r) {
      if (r == null) return "";
      if (r >= 1.15) return "great";
      if (r >= 0.95) return "";
      if (r >= 0.85) return "low";
      return "poor";
    }

    /** 面板：双方按 ratingPro 降序，一眼看出对面谁是大哥 */
    function renderPanel(data) {
      el("panel-map").textContent = data.map || "-";
      const body = el("panel-body");
      body.innerHTML = "";
      for (const [label, cls, rows] of [
        ["CT", "ct", data.ct],
        ["T", "t", data.t],
      ]) {
        const title = document.createElement("div");
        title.className = `team-title ${cls}`;
        title.textContent = label;
        body.appendChild(title);

        const sorted = [...rows].sort(
          (a, b) => (b.rating_pro ?? -1) - (a.rating_pro ?? -1)
        );
        for (const row of sorted) {
          const line = document.createElement("div");
          line.className = "prow";
          line.title = row.steamid;
          const nick = document.createElement("span");
          nick.className = "nick";
          nick.textContent = row.nickname || row.steamid;
          const rating = document.createElement("span");
          rating.className = `rating ${ratingClass(row.rating_pro)}`;
          rating.textContent = row.rating_pro != null ? row.rating_pro.toFixed(2) : "—";
          const kd = document.createElement("span");
          kd.className = "kd";
          kd.textContent = row.kd != null ? `K/D ${row.kd.toFixed(2)}` : "";
          const score = document.createElement("span");
          score.className = "score";
          score.textContent = row.pvp_score != null ? row.pvp_score : "";
          line.append(nick, rating, kd, score);
          line.addEventListener("click", () => invoke("open_main").catch(() => {}));
          body.appendChild(line);
        }
        if (!rows.length) {
          const none = document.createElement("div");
          none.className = "prow";
          none.innerHTML = '<span class="nick" style="color:var(--faint)">暂无数据</span>';
          body.appendChild(none);
        }
      }
    }

    function showView(view) {
      document.body.className = `view-${view}`;
    }

    // 同一套事件流：主窗口与悬浮窗消费同一份数据
    listen("watcher", (e) => {
      const ev = e.payload;
      switch (ev.type) {
        case "Account":
          setState("READY", "live");
          break;
        case "Connected":
          full = ev.data.full;
          loaded = 0;
          lastReport = null;
          if (document.body.classList.contains("view-panel")) showView("pill");
          setState("LISTENING", "live");
          renderRoster();
          break;
        case "Progress":
          full = ev.data.full;
          loaded = ev.data.loaded;
          setState("等队友", "live");
          renderRoster();
          break;
        case "Resubscribed":
          setState("重订中", "warn");
          break;
        case "Notice":
          if (ev.data.level === "error") setState("出错了", "bad");
          break;
        case "Report":
          lastReport = ev.data;
          renderPanel(ev.data.data);
          showView("panel");
          setState("已出表", "live");
          break;
        case "Finished":
          // 出过表就停在面板上让人看；没出过才收回胶囊
          if (!lastReport) {
            showView("pill");
            setState("STANDBY", "");
            loaded = 0;
            renderRoster();
          } else {
            el("panel-map").textContent = `${lastReport.data.map || "-"} · 会话结束`;
          }
          break;
      }
    });

    // 视图切换（窗口尺寸由 Rust 侧同步调整）
    listen("floating-view", (e) => showView(e.payload));

    // 悬浮窗打开时若没有新事件，先亮出 token 健康度
    invoke("token_status")
      .then((s) => {
        if (!s.config_found || !s.has_token) setDot("bad");
      })
      .catch(() => {});

    el("collapse").addEventListener("click", (e) => {
      e.stopPropagation();
      invoke("float_set_view", { view: "dot" }).catch(() => {});
    });
    for (const id of ["hide", "hide2"]) {
      el(id).addEventListener("click", (e) => {
        e.stopPropagation();
        invoke("set_floating_visible", { visible: false }).catch(() => {});
      });
    }
    el("panel-shrink").addEventListener("click", () =>
      invoke("float_set_view", { view: "pill" }).catch(() => {})
    );
    // 点胶囊回主窗口；小圆钮点一下展开回胶囊
    el("pill").addEventListener("dblclick", () => invoke("open_main").catch(() => {}));
    el("dot-view").addEventListener("click", () =>
      invoke("float_set_view", { view: "pill" }).catch(() => {})
    );

    setState("STANDBY");
  </script>
</body>
</html>
