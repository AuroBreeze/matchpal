[package]
name = "match_watcher"
version = "0.1.0"
edition = "2024"
description = "监听完美世界电竞当前对局：拿 matchId 与 10 人名单，可选合并战绩"

[dependencies]
# 分级日志(时间戳/级别过滤/颜色)，与 fetch_token 共用一套
logkit = { path = "../logkit" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"

# HTTP：native-tls 在 Windows 上走 schannel、读 **Windows 证书库**，
# 所以本机装着中间人 CA 时能直接过，不需要 Python 版那个
# 「校验失败就降级成不校验」的兜底。关掉默认 feature 是为了不引入第二套 TLS 栈。
ureq = { version = "3", default-features = false, features = ["native-tls", "json"] }

# WebSocket：握手要自定义 Cookie / Origin 头，读帧要能设超时
tungstenite = { version = "0.30", features = ["native-tls"] }

url = "2"
